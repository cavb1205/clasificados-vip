# Producción · VPS DigitalOcean con Traefik existente (EasyPanel).
#
# Despliegue (git pull): /opt/vip es un working tree de git (rama main).
#   - Primera vez: crear /opt/vip/backend/.env.production desde .env.production.example.
#   - Cada deploy:  ssh deploy@VPS '/opt/vip/deploy.sh'
#     (deploy.sh hace git reset --hard origin/main + docker compose up -d --build).
#   Flujo recomendado: push a main → CI verde → correr deploy.sh.

services:
  vip-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: clasificados-vip-backend:latest
    container_name: vip-backend
    restart: unless-stopped
    env_file:
      # `format: raw` (compose v2.30+) deshabilita la interpolación de ${VAR}
      # dentro del .env, evitando que un SECRET_KEY con `$x` se mutile.
      - path: .env.production
        format: raw
    environment:
      # Forzar el seed inicial de regiones/comunas/planes al primer arranque
      # (los comandos seed_* son idempotentes, no daña re-correrlos).
      SEED_ON_START: "1"
    volumes:
      - vip_media:/app/media
      - vip_private_media:/app/private_media
    networks:
      - easypanel
    labels:
      - traefik.enable=true
      - traefik.docker.network=easypanel
      - traefik.http.services.vip-backend.loadbalancer.server.port=8000
      # HTTPS router con TLS automático (Let's Encrypt via Traefik).
      - traefik.http.routers.vip-backend.rule=Host(`api-165-22-154-95.nip.io`)
      - traefik.http.routers.vip-backend.entrypoints=https
      - traefik.http.routers.vip-backend.tls=true
      - traefik.http.routers.vip-backend.tls.certresolver=letsencrypt
      # Redirect HTTP → HTTPS (reusa middleware definido por EasyPanel en file provider).
      - traefik.http.routers.vip-backend-http.rule=Host(`api-165-22-154-95.nip.io`)
      - traefik.http.routers.vip-backend-http.entrypoints=http
      - traefik.http.routers.vip-backend-http.middlewares=redirect-to-https@file
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; request=urllib.request.Request('http://localhost:8000/healthz/', headers={'X-Forwarded-Proto':'https'}); sys.exit(0 if urllib.request.urlopen(request, timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Mantenimiento periódico: no depende de un cron instalado en el host.
  vip-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: clasificados-vip-backend:latest
    container_name: vip-scheduler
    restart: unless-stopped
    env_file:
      - path: .env.production
        format: raw
    environment:
      SKIP_ENTRYPOINT_PREP: "1"
      SEED_ON_START: "0"
      SCHEDULER_INTERVAL_SECONDS: "900"
      SCHEDULER_JOB_TIMEOUT_SECONDS: "600"
    command: ["./scheduler.sh"]
    volumes:
      - vip_media:/app/media
      - vip_private_media:/app/private_media
    networks:
      - easypanel
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/scheduler-heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<1800 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  easypanel:
    external: true

volumes:
  vip_media:
  vip_private_media:
