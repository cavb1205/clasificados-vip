name: CI

# Corre los tests del backend y el build del frontend en cada push a main y en
# cada Pull Request, para que `main` nunca reciba código que no compila o rompe
# tests. No despliega (el deploy a producción sigue siendo manual por ahora).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · Django tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vip_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vip_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt
      - name: Run tests
        run: python manage.py test --verbosity 1
        env:
          # Ambas bases se prueban: SQLite no detecta fallos de FOR UPDATE.
          # Credenciales exclusivas del contenedor efímero de CI.
          POSTGRES_DB: ${{ matrix.database == 'postgres' && 'vip_ci' || '' }}
          POSTGRES_USER: vip_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          DJANGO_SECRET_KEY: ci-insecure-test-key
          KYC_ENCRYPTION_KEY: HAjBiEa8QCdkP7eiTzVTxScO7XNf_Asc7ZaHhSzMNRc=
          DJANGO_DEBUG: "True"

  frontend:
    name: Frontend · Next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Lint (ESLint)
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npm run test
      - name: Build (type-check + compile)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
